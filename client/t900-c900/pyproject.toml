[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "t900-c900"
version = "0.1.0"
description = "Clean-room Python client and simulator for T900 and C900 smartwatches"
readme = "README.md"
authors = [{ name = "reWatch" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
t900-c900 = "t900_c900.cli:main"
